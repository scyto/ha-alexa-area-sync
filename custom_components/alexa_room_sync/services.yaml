preview:
  name: Preview room sync (read-only)
  description: >-
    Read-only. Builds the HA area -> Alexa room plan and logs it (matched and
    unmatched devices). Never writes to Alexa. Run this first.
  fields:
    area_id:
      name: Area
      description: Limit the preview to a single HA area (optional).
      required: false
      selector:
        area:

list_groups:
  name: List existing Alexa groups
  description: Read-only. Lists the groups/rooms that already exist in your Alexa account.

sync_area:
  name: Sync one area (the single-room test)
  description: >-
    Create/verify the Alexa room for ONE HA area. Use this for the first, reversible
    test. Writes only if 'apply' is true AND writes are confirmed in the integration
    options; otherwise behaves as a preview.
  fields:
    area_id:
      name: Area
      description: The HA area to sync.
      required: true
      selector:
        area:
    apply:
      name: Apply (write to Alexa)
      description: >-
        If true, actually create the room. Requires the write-confirmation option to be
        enabled. If false/omitted, this is a dry run.
      required: false
      default: false
      selector:
        boolean:

sync:
  name: Sync all areas
  description: >-
    Create Alexa rooms for every HA area with exposed devices. Existing groups with a
    matching name are skipped (never duplicated or deleted). Writes only if 'apply' is
    true AND writes are confirmed in options; otherwise a dry run.
  fields:
    apply:
      name: Apply (write to Alexa)
      description: If true, actually create the rooms (requires the options confirmation).
      required: false
      default: false
      selector:
        boolean:
